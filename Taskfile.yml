version: "3"

dotenv: [".env"]

vars:
  BIN: "{{.TASK_DIR}}/bin/gosqlkit"
  EXAMPLE_SCHEMA: "examples/basic/schema"
  EXAMPLE_SQL: "examples/basic/db/schema.generated.sql"
  EXAMPLE_SNAPSHOT: "examples/basic/db/schema.snapshot.json"

tasks:
  default:
    desc: Run the standard local verification set
    cmds:
      - task: verify

  setup:
    desc: Install git hooks for this repository
    cmds:
      - go tool lefthook install

  build:
    desc: Build the gosqlkit CLI
    cmds:
      - mkdir -p "{{.TASK_DIR}}/bin"
      - go build -o "{{.BIN}}" ./cmd/gosqlkit

  test:
    desc: Run all Go tests
    cmds:
      - gotestsum --format testname --junitfile test-results.xml -- ./...

  integration:
    desc: Run Docker-backed integration tests against PostgreSQL
    cmds:
      - GOSQLKIT_INTEGRATION=1 go test ./... -count=1

  integration:postgres:matrix:
    desc: Run PostgreSQL integration tests across supported PostgreSQL images
    cmds:
      - |
        set -e

        images="${GOSQLKIT_POSTGRES_IMAGES:-postgres:15-alpine postgres:16-alpine postgres:17-alpine}"
        for image in $images; do
          echo "Running PostgreSQL integration tests with $image"
          GOSQLKIT_INTEGRATION=1 GOSQLKIT_POSTGRES_IMAGE="$image" go test ./internal/app -run TestPostgresIntegration -count=1
        done

  integration:postgres:pgvector:
    desc: Run PostgreSQL integration tests against a pgvector image
    cmds:
      - GOSQLKIT_INTEGRATION=1 GOSQLKIT_POSTGRES_IMAGE="${GOSQLKIT_PGVECTOR_IMAGE:-pgvector/pgvector:pg16}" go test ./internal/app -run TestPostgresIntegrationPgVectorTypes -count=1

  generate:
    desc: Regenerate the checked-in example schema SQL
    cmds:
      - cmd: "cd examples/basic && go run ../../cmd/gosqlkit generate"
        ignore_error: false

  generate:check:
    desc: Check the checked-in example schema SQL is current
    cmds:
      - cmd: "cd examples/basic && go run ../../cmd/gosqlkit generate --check"
        ignore_error: false

  snapshot:
    desc: Regenerate the checked-in example schema snapshot JSON
    cmds:
      - cmd: "cd examples/basic && go run ../../cmd/gosqlkit snapshot"
        ignore_error: false

  snapshot:check:
    desc: Check the checked-in example schema snapshot JSON is current
    cmds:
      - cmd: "cd examples/basic && go run ../../cmd/gosqlkit snapshot --check"
        ignore_error: false

  sqlc:check:
    desc: Validate the example schema and queries with sqlc in a temp directory
    cmds:
      - |
        set -e

        if ! command -v sqlc >/dev/null 2>&1; then
          echo "sqlc not found; install sqlc to run this check" >&2
          exit 1
        fi

        WORK="$(mktemp -d)"
        trap 'rm -rf "$WORK"' EXIT

        cp -R examples/basic/. "$WORK"
        cd "$WORK"

        sqlc generate

  fmt:
    desc: Format all Go files with gofumpt
    cmds:
      - cmd: find . -name '*.go' -not -path './reference_code/*' -print0 | xargs -0 go tool gofumpt -w

  fmt:check:
    desc: Check Go files are formatted with gofumpt
    cmds:
      - |
        set -e

        files="$(find . -name '*.go' -not -path './reference_code/*' -print0 | xargs -0 go tool gofumpt -l)"
        if [ -n "$files" ]; then
          echo "The following files need formatting:"
          echo "$files"
          echo
          echo "Run: task fmt"
          exit 1
        fi

  fix:fieldalignment:
    desc: Reorder struct fields to reduce memory usage
    cmds:
      - go tool fieldalignment -fix ./...

  modernize:
    desc: Apply Go modernization fixes
    cmds:
      - go tool modernize -fix ./...

  modernize:check:
    desc: Report Go modernization opportunities without applying fixes
    cmds:
      - go tool modernize ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - |
        set -e

        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint not found; install golangci-lint to run this check" >&2
          exit 1
        fi

        golangci-lint run ./...

  vuln:
    desc: Run govulncheck
    cmds:
      - go tool govulncheck ./...

  verify:fmt:
    desc: Check Go formatting
    cmds:
      - task: fmt:check

  verify:build:
    desc: Compile all packages
    cmds:
      - go build ./...

  verify:test:
    desc: Run all Go tests
    cmds:
      - task: test

  verify:generate:
    desc: Check generated example SQL and snapshot JSON are current
    cmds:
      - task: generate:check
      - task: snapshot:check

  verify:sqlc:
    desc: Run the sqlc compatibility check
    cmds:
      - task: sqlc:check

  verify:cli:
    desc: Smoke-test the gosqlkit CLI
    deps: [build]
    cmds:
      - "{{.BIN}} --help"
      - "{{.BIN}} inspect --help"
      - "{{.BIN}} version"
      - "cd examples/basic && {{.BIN}} generate --check"
      - "cd examples/basic && {{.BIN}} snapshot --check"
      - "{{.BIN}} generate ./{{.EXAMPLE_SCHEMA}} > /dev/null"
      - "{{.BIN}} generate --out {{.EXAMPLE_SQL}} --check ./{{.EXAMPLE_SCHEMA}}"

  verify:lint:
    desc: Run lint checks
    cmds:
      - task: lint

  verify:vuln:
    desc: Run vulnerability checks
    cmds:
      - task: vuln

  verify:
    desc: Run the main project checks
    cmds:
      - task: fix:fieldalignment
      - task: verify:fmt
      - task: verify:build
      - task: verify:test
      - task: verify:generate
      - task: verify:sqlc
      - task: verify:cli
      - task: verify:lint
      - task: verify:vuln
